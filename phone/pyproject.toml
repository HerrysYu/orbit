[project]
name = "orbit-phone"
version = "0.1.0"
description = "Offline-testable Android MCP primitives for OpenPersonalAgent"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "phone-agent @ git+https://github.com/zai-org/Open-AutoGLM.git@86f55382982fb054e8fc98ca80609dff8a2cdc3c",
  "Pillow==12.3.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orbit_phone"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
